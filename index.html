<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song List</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f7f7f7; }
    h1 { text-align: center; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .filters input, .filters select { padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    .filters input { flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #333; color: #fff; }
    tr:hover { background: #f0f8ff; }
    .count { margin: 10px 0; color: #555; }
  </style>
</head>
<body>

  <h1>Song List</h1>

  <div class="filters">
    <input type="text" id="search" placeholder="Search by song or singer...">
    <select id="filterLanguage">
      <option value="">All languages</option>
    </select>
    <select id="filterSinger">
      <option value="">All singers</option>
    </select>
  </div>

  <div class="count" id="count"></div>

  <table>
    <thead>
      <tr>
        <th>No.</th>
        <th>Song</th>
        <th>In Vietnamese</th>
        <th>Singer版本</th>
        <th>Language</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    let songs = [];

    const searchEl = document.getElementById('search');
    const languageEl = document.getElementById('filterLanguage');
    const singerEl = document.getElementById('filterSinger');
    const tableBodyEl = document.getElementById('tableBody');
    const countEl = document.getElementById('count');

    // Load data from songs.json
    fetch('songs.json')
      .then(res => res.json())
      .then(data => {
        songs = data;
        fillOptions(languageEl, [...new Set(songs.map(s => s['Language']).filter(Boolean))]);
        fillOptions(singerEl, [...new Set(songs.map(s => s['Singer版本']).filter(v => v && v !== 'None'))]);
        render();
      })
      .catch(() => {
        countEl.textContent = 'Could not load songs.json. Please check the file.';
      });

    // Create filter options
    function fillOptions(selectEl, values) {
      values.sort().forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        selectEl.appendChild(opt);
      });
    }

    // Filter and display
    function render() {
      const keyword = searchEl.value.trim().toLowerCase();
      const language = languageEl.value;
      const singer = singerEl.value;

      const result = songs.filter(s => {
        const matchKeyword = !keyword ||
          (s['Song'] || '').toLowerCase().includes(keyword) ||
          (s['In Vietnamese'] || '').toLowerCase().includes(keyword) ||
          (s['Singer版本'] || '').toLowerCase().includes(keyword);
        const matchLanguage = !language || s['Language'] === language;
        const matchSinger = !singer || s['Singer版本'] === singer;
        return matchKeyword && matchLanguage && matchSinger;
      });

      tableBodyEl.innerHTML = result.map(s => `
        <tr>
          <td>${s['No.'] ?? ''}</td>
          <td>${s['Song'] ?? ''}</td>
          <td>${s['In Vietnamese'] ?? ''}</td>
          <td>${s['Singer版本'] === 'None' ? '' : (s['Singer版本'] ?? '')}</td>
          <td>${s['Language'] ?? ''}</td>
          <td>${s['Note'] ?? ''}</td>
        </tr>
      `).join('');

      countEl.textContent = `Showing ${result.length} / ${songs.length} songs`;
    }

    searchEl.addEventListener('input', render);
    languageEl.addEventListener('change', render);
    singerEl.addEventListener('change', render);
  </script>

</body>
</html>
